name: vale_helper
description: "Babel Board: plays data-only game modules for board games you can't read."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.11.5

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  quick_actions: ^1.1.1
  receive_sharing_intent: 1.8.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - modules/AI_INSTRUCTIONS.md
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
